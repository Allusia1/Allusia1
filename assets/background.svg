<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="391" viewBox="0 0 1000 391" font-family="ui-monospace,'SF Mono','Cascadia Code','JetBrains Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace">
<style>
.rv{animation:rv .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes rv{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.blink{animation:blink 1.1s steps(1,end) infinite}
@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
  <clipPath id="win"><rect x="1" y="1" width="998" height="383" rx="14"/></clipPath>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fff" fill-opacity=".05"/></pattern>
</defs>
<g clip-path="url(#win)">
  <rect width="1000" height="385" fill="#0f141b"/>
  <rect width="1000" height="385" fill="url(#dots)"/>
  <rect width="1000" height="41" fill="#151c25"/>
  <line x1="0" y1="41.5" x2="1000" y2="41.5" stroke="#263040"/>
</g>
<rect x="1" y="1" width="998" height="383" rx="14" fill="none" stroke="#263040" stroke-width="1.5"/>
<circle cx="24" cy="20.5" r="6" fill="#ff5f57"/><circle cx="44" cy="20.5" r="6" fill="#febc2e"/><circle cx="64" cy="20.5" r="6" fill="#28c840"/>
<text x="500.0" y="25" text-anchor="middle" font-size="13" fill="#8b98a7">logan@allusia: ~</text>

<g class="rv" style="animation-delay:0.10s"><text y="84" font-size="15"><tspan x="36" fill="#7ee2b8">$</tspan><tspan x="56" fill="#e6edf3">whoami</tspan></text></g>
<g class="rv" style="animation-delay:0.25s"><text x="36" y="112" font-size="15" fill="#8b98a7">logan (allusia)</text></g>
<g class="rv" style="animation-delay:0.50s"><text y="154" font-size="15"><tspan x="36" fill="#7ee2b8">$</tspan><tspan x="56" fill="#e6edf3">cat background.txt</tspan></text></g>
<g class="rv" style="animation-delay:0.70s"><text y="188" font-size="15"><tspan x="36" fill="#7ee2b8">[+]</tspan><tspan x="80" fill="#c9d1d9">authorized security research</tspan><tspan x="384" fill="#8b98a7">scoped testing · reproducible findings · private disclosure</tspan></text></g>
<g class="rv" style="animation-delay:0.82s"><text y="219" font-size="15"><tspan x="36" fill="#7ee2b8">[+]</tspan><tspan x="80" fill="#c9d1d9">U.S. Army IT Specialist (25B)</tspan><tspan x="384" fill="#8b98a7">2024 – present</tspan></text></g>
<g class="rv" style="animation-delay:0.94s"><text y="250" font-size="15"><tspan x="36" fill="#7ee2b8">[+]</tspan><tspan x="80" fill="#c9d1d9">B.S. Cyber Security</tspan><tspan x="384" fill="#8b98a7">American Military University · in progress</tspan></text></g>
<g class="rv" style="animation-delay:1.06s"><text y="281" font-size="15"><tspan x="36" fill="#7ee2b8">[+]</tspan><tspan x="80" fill="#c9d1d9">CompTIA</tspan><tspan x="384" fill="#8b98a7">Network+ · Tech+</tspan></text></g>
<g class="rv" style="animation-delay:1.18s"><text y="312" font-size="15"><tspan x="36" fill="#7ee2b8">[+]</tspan><tspan x="80" fill="#c9d1d9">practice</tspan><tspan x="384" fill="#8b98a7">TryHackMe · Hack The Box</tspan></text></g>
<g class="rv" style="animation-delay:1.30s"><text x="36" y="355" font-size="15" fill="#7ee2b8">$</text><rect class="blink" x="56" y="341" width="9" height="18" fill="#c9d1d9"/></g>
</svg>
