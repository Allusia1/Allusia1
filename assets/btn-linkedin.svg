<svg xmlns="http://www.w3.org/2000/svg" width="154" height="44" viewBox="0 0 154 44" font-family="ui-monospace,'SF Mono','Cascadia Code','JetBrains Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace">
<style>
.rv{animation:rv .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes rv{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.blink{animation:blink 1.1s steps(1,end) infinite}
@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="1" y="1" width="152" height="42" rx="10" fill="#0f141b" stroke="#263040" stroke-width="1.5"/><text y="27.5" font-size="15"><tspan x="18" fill="#7ee2b8">›</tspan><tspan x="36" fill="#c9d1d9">linkedin</tspan></text><text x="136" y="27.5" text-anchor="end" font-size="15" fill="#56657a">↗</text>
</svg>
