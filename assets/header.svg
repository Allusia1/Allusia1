<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="376" viewBox="0 0 1000 376" font-family="ui-monospace,'SF Mono','Cascadia Code','JetBrains Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace">
<style>
.rv{animation:rv .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes rv{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.blink{animation:blink 1.1s steps(1,end) infinite}
@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.hl{animation:fade .4s 2.1s both,step 8s 2.3s infinite step-end}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes step{0%{transform:translateY(0px)}10%{transform:translateY(24px)}20%{transform:translateY(48px)}30%{transform:translateY(72px)}40%{transform:translateY(96px)}50%{transform:translateY(144px)}60%{transform:translateY(192px)}70%{transform:translateY(240px)}100%{transform:translateY(240px)}}</style>
<defs>
  <clipPath id="win"><rect x="1" y="1" width="998" height="358" rx="14"/></clipPath>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fff" fill-opacity=".05"/></pattern>
</defs>
<g clip-path="url(#win)">
  <rect width="1000" height="360" fill="#0f141b"/>
  <rect width="1000" height="360" fill="url(#dots)"/>
  <rect width="1000" height="41" fill="#151c25"/>
  <line x1="0" y1="41.5" x2="1000" y2="41.5" stroke="#263040"/>
</g>
<rect x="1" y="1" width="998" height="358" rx="14" fill="none" stroke="#263040" stroke-width="1.5"/>
<circle cx="24" cy="20.5" r="6" fill="#ff5f57"/><circle cx="44" cy="20.5" r="6" fill="#febc2e"/><circle cx="64" cy="20.5" r="6" fill="#28c840"/>
<text x="500.0" y="25" text-anchor="middle" font-size="13" fill="#8b98a7">allusia.exe — disassembly</text>
<text x="978" y="25" text-anchor="end" font-size="12" fill="#56657a">x86-64 · PE32+</text>
<rect x="462" y="42" width="538" height="318" fill="#0b1016" clip-path="url(#win)"/>
<line x1="462.5" y1="42" x2="462.5" y2="358.5" stroke="#263040"/>
<g class="rv" style="animation-delay:0.10s"><text x="44" y="112" font-size="16" fill="#e3b341">; hi, i'm</text></g>
<g class="rv" style="animation-delay:0.20s"><text x="42" y="174"><tspan font-size="64" font-weight="700" fill="#e6edf3">Logan</tspan><tspan dx="16" font-size="26" fill="#8b98a7">(Allusia)</tspan></text></g>
<g class="rv" style="animation-delay:0.35s"><text x="44" y="224" font-size="28" font-weight="600" fill="#7ee2b8">reverse engineer</text></g>
<g class="rv" style="animation-delay:0.50s"><text x="44" y="262" font-size="16" fill="#8b98a7">binaries · runtimes · network traffic</text></g>
<g class="rv" style="animation-delay:0.65s"><circle class="pulse" cx="49" cy="314" r="4" fill="#7ee2b8"/><text x="62" y="319" font-size="13" fill="#56657a">authorized targets only</text></g>
<g class="hl" clip-path="url(#win)"><rect x="463" y="67" width="538" height="24" fill="#7ee2b8" fill-opacity=".09"/><rect x="463" y="67" width="3" height="24" fill="#7ee2b8"/><text x="480" y="83" font-size="11" fill="#7ee2b8">▶</text></g>
<g class="rv" style="animation-delay:0.50s"><text y="84" font-size="15"><tspan x="500" fill="#56657a">140001000</tspan><tspan x="598" fill="#6f8096">55</tspan><tspan x="738" fill="#7ee2b8">push</tspan><tspan x="796" fill="#d2a8ff">rbp</tspan></text></g>
<g class="rv" style="animation-delay:0.62s"><text y="108" font-size="15"><tspan x="500" fill="#56657a">140001001</tspan><tspan x="598" fill="#6f8096">48 89 e5</tspan><tspan x="738" fill="#7ee2b8">mov</tspan><tspan x="796" fill="#d2a8ff">rbp</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#d2a8ff">rsp</tspan></text></g>
<g class="rv" style="animation-delay:0.74s"><text y="132" font-size="15"><tspan x="500" fill="#56657a">140001004</tspan><tspan x="598" fill="#6f8096">e8 f7 1f 00 00</tspan><tspan x="738" fill="#7ee2b8">call</tspan><tspan x="796" fill="#79c0ff">read_binary</tspan></text></g>
<g class="rv" style="animation-delay:0.86s"><text y="156" font-size="15"><tspan x="500" fill="#56657a">140001009</tspan><tspan x="598" fill="#6f8096">48 85 c0</tspan><tspan x="738" fill="#7ee2b8">test</tspan><tspan x="796" fill="#d2a8ff">rax</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#d2a8ff">rax</tspan></text></g>
<g class="rv" style="animation-delay:0.98s"><text y="180" font-size="15"><tspan x="500" fill="#56657a">14000100c</tspan><tspan x="598" fill="#6f8096">74 0a</tspan><tspan x="738" fill="#7ee2b8">je</tspan><tspan x="796" fill="#79c0ff">done</tspan></text></g>
<g class="rv" style="animation-delay:1.10s"><text x="598" y="204" font-size="15" fill="#e3b341">; how it actually works</text></g>
<g class="rv" style="animation-delay:1.22s"><text y="228" font-size="15"><tspan x="500" fill="#56657a">14000100e</tspan><tspan x="598" fill="#6f8096">e8 ed 2f 00 00</tspan><tspan x="738" fill="#7ee2b8">call</tspan><tspan x="796" fill="#79c0ff">understand_it</tspan></text></g>
<g class="rv" style="animation-delay:1.34s"><text x="598" y="252" font-size="15" fill="#e3b341">; where it breaks</text></g>
<g class="rv" style="animation-delay:1.46s"><text y="276" font-size="15"><tspan x="500" fill="#56657a">140001013</tspan><tspan x="598" fill="#6f8096">e8 e8 3f 00 00</tspan><tspan x="738" fill="#7ee2b8">call</tspan><tspan x="796" fill="#79c0ff">find_the_break</tspan></text></g>
<g class="rv" style="animation-delay:1.58s"><text x="598" y="300" font-size="15" fill="#79c0ff">done:</text></g>
<g class="rv" style="animation-delay:1.70s"><text y="324" font-size="15"><tspan x="500" fill="#56657a">140001018</tspan><tspan x="598" fill="#6f8096">c3</tspan><tspan x="738" fill="#7ee2b8">ret</tspan></text></g>
</svg>
